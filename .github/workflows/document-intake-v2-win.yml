name: Build Document Intake 2.0 Windows EXE

on:
  push:
    branches:
      - build/document-intake-v2.0.0
    paths:
      - "tools/document-intake/v2parts/**"
      - ".github/workflows/document-intake-v2-win.yml"
      - "tools/document-intake/requirements-build.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Assemble single source
        shell: pwsh
        run: |
          $parts = @(
            "tools/document-intake/v2parts/part00.pyfrag",
            "tools/document-intake/v2parts/part01.pyfrag",
            "tools/document-intake/v2parts/part02.pyfrag",
            "tools/document-intake/v2parts/part03.pyfrag"
          )
          $out = "tools/document-intake/DocumentIntake_v2.py"
          if (Test-Path $out) { Remove-Item $out -Force }
          foreach ($p in $parts) { Get-Content $p -Raw | Add-Content $out -Encoding utf8; Add-Content $out "" -Encoding utf8 }
          $src = Get-Content $out -Raw
          $src = $src.Replace("startswith('20260922_123-2026-CV-BTH_CV_BTH_')","startswith('20260922_123-2026-CV-BTH_CV_')")
          Set-Content $out $src -Encoding utf8 -NoNewline
          python -m py_compile $out

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install PyMuPDF==1.26.4 Pillow==11.3.0 pyinstaller==6.16.0

      - name: Install Tesseract on build runner
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $src = "C:\Program Files\Tesseract-OCR"
          if (!(Test-Path "$src\tesseract.exe")) { throw "Tesseract not found" }

      - name: Prepare minimal embedded OCR runtime
        shell: pwsh
        run: |
          $src = "C:\Program Files\Tesseract-OCR"
          $dst = "tools\document-intake\runtime-v2"
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Get-ChildItem $src -File | Where-Object { $_.Extension -in ".exe",".dll" } | Copy-Item -Destination $dst -Force
          $td = Join-Path $dst "tessdata"
          New-Item -ItemType Directory -Force -Path $td | Out-Null
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/vie.traineddata" -OutFile (Join-Path $td "vie.traineddata")
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata" -OutFile (Join-Path $td "eng.traineddata")
          & (Join-Path $dst "tesseract.exe") --tessdata-dir $td --list-langs
          if ($LASTEXITCODE -ne 0) { throw "Minimal OCR runtime validation failed" }
          $bytes = (Get-ChildItem $dst -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host "Embedded OCR runtime bytes: $bytes"

      - name: Build optimized one-file EXE
        shell: pwsh
        working-directory: tools/document-intake
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name DocumentIntake --add-binary "runtime-v2;runtime" DocumentIntake_v2.py
          if (!(Test-Path "dist\DocumentIntake.exe")) { throw "EXE not created" }

      - name: Run EXE acceptance test
        shell: pwsh
        working-directory: tools/document-intake
        run: |
          $p = Start-Process -FilePath ".\dist\DocumentIntake.exe" -ArgumentList "--self-test" -WorkingDirectory ".\dist" -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            if (Test-Path "dist\SELF_TEST_RESULT.json") { Get-Content "dist\SELF_TEST_RESULT.json" }
            throw "Self-test failed: $($p.ExitCode)"
          }
          $r = Get-Content "dist\SELF_TEST_RESULT.json" -Raw | ConvertFrom-Json
          if (!$r.passed) { Get-Content "dist\SELF_TEST_RESULT.json"; throw "Self-test report failed" }
          Get-Content "dist\SELF_TEST_RESULT.json"

      - name: GUI smoke test
        shell: pwsh
        working-directory: tools/document-intake
        run: |
          $p = Start-Process -FilePath ".\dist\DocumentIntake.exe" -PassThru
          Start-Sleep -Seconds 7
          if ($p.HasExited) {
            $err = "$env:LOCALAPPDATA\DocumentIntake\startup_error.txt"
            if (Test-Path $err) { Get-Content $err }
            throw "GUI exited unexpectedly"
          }
          Stop-Process -Id $p.Id -Force

      - name: Package report
        shell: pwsh
        working-directory: tools/document-intake
        run: |
          $f = Get-Item ".\dist\DocumentIntake.exe"
          $h = Get-FileHash ".\dist\DocumentIntake.exe" -Algorithm SHA256
          Write-Host "EXE bytes: $($f.Length)"
          Write-Host "SHA256: $($h.Hash)"
          @"
          Document Intake 2.0
          EXE_BYTES=$($f.Length)
          SHA256=$($h.Hash)
          BUILD=windows-x64-onefile
          "@ | Set-Content ".\dist\BUILD_INFO.txt"

      - name: Upload tested build
        uses: actions/upload-artifact@v4
        with:
          name: DocumentIntake-Windows-x64-v2.0.0
          path: |
            tools/document-intake/dist/DocumentIntake.exe
            tools/document-intake/dist/SELF_TEST_RESULT.json
            tools/document-intake/dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 7
