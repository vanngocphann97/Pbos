name: Build Document Intake Windows EXE

on:
  push:
    branches:
      - build/document-intake-v1.2.0
    paths:
      - "tools/document-intake/**"
      - ".github/workflows/document-intake-win.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/document-intake/requirements-build.txt

      - name: Install Tesseract on build runner
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $tess = "C:\Program Files\Tesseract-OCR"
          if (!(Test-Path "$tess\tesseract.exe")) { throw "Tesseract executable not found at $tess" }

      - name: Prepare embedded OCR runtime
        shell: pwsh
        run: |
          $src = "C:\Program Files\Tesseract-OCR"
          $dst = "tools\document-intake\runtime"
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "$src\*" $dst -Recurse -Force
          $tessdata = Join-Path $dst "tessdata"
          New-Item -ItemType Directory -Force -Path $tessdata | Out-Null
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/vie.traineddata" -OutFile (Join-Path $tessdata "vie.traineddata")
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata" -OutFile (Join-Path $tessdata "eng.traineddata")
          & (Join-Path $dst "tesseract.exe") --tessdata-dir $tessdata --list-langs
          if ($LASTEXITCODE -ne 0) { throw "Embedded Tesseract runtime validation failed" }

      - name: Build single-file EXE
        shell: pwsh
        working-directory: tools/document-intake
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name DocumentIntake --add-binary "runtime;runtime" --collect-all pymupdf --collect-all PIL DocumentIntake.py
          if (!(Test-Path "dist\DocumentIntake.exe")) { throw "DocumentIntake.exe was not created" }

      - name: Run EXE self-test
        shell: pwsh
        working-directory: tools/document-intake
        run: |
          $p = Start-Process -FilePath ".\dist\DocumentIntake.exe" -ArgumentList "--self-test" -WorkingDirectory ".\dist" -PassThru -Wait
          $code = $p.ExitCode
          if ($code -ne 0) {
            if (Test-Path "dist\SELF_TEST_RESULT.json") { Get-Content "dist\SELF_TEST_RESULT.json" }
            if (Test-Path "dist\startup_error.txt") { Get-Content "dist\startup_error.txt" }
            throw "DocumentIntake.exe self-test failed with exit code $code"
          }
          if (!(Test-Path "dist\SELF_TEST_RESULT.json")) { throw "SELF_TEST_RESULT.json was not produced" }
          $result = Get-Content "dist\SELF_TEST_RESULT.json" -Raw | ConvertFrom-Json
          if (!$result.passed) { Get-Content "dist\SELF_TEST_RESULT.json"; throw "Self-test report is not PASS" }
          Get-Content "dist\SELF_TEST_RESULT.json"

      - name: Smoke test GUI process
        shell: pwsh
        working-directory: tools/document-intake
        run: |
          $p = Start-Process -FilePath ".\dist\DocumentIntake.exe" -WorkingDirectory ".\dist" -PassThru
          Start-Sleep -Seconds 6
          if ($p.HasExited) {
            if (Test-Path ".\dist\startup_error.txt") { Get-Content ".\dist\startup_error.txt" }
            throw "GUI process exited unexpectedly"
          }
          Stop-Process -Id $p.Id -Force

      - name: Report EXE size and SHA256
        shell: pwsh
        working-directory: tools/document-intake
        run: |
          $f = Get-Item ".\dist\DocumentIntake.exe"
          Write-Host ("EXE bytes: " + $f.Length)
          Get-FileHash ".\dist\DocumentIntake.exe" -Algorithm SHA256 | Format-List

      - name: Upload tested EXE
        uses: actions/upload-artifact@v4
        with:
          name: DocumentIntake-Windows-x64-v1.2.0
          path: |
            tools/document-intake/dist/DocumentIntake.exe
            tools/document-intake/dist/SELF_TEST_RESULT.json
          if-no-files-found: error
          retention-days: 7
